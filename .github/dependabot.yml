version: 2

updates:
  # Covers the root manifest and every workspace, because Dependabot reads the
  # Yarn workspace layout from the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TypeScript 7, and ESLint cannot even
      # load its configuration when that version is installed. Remove this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940 is
      # closed.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # The major version of these types follows the Node major they describe,
      # so it has to match the runtime declared in engines rather than the
      # latest release. Raise it by hand when the pinned Node version moves.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    groups:
      # Security updates are raised by Dependabot alerts as soon as an advisory
      # is published, not by the schedule above, which covers version updates
      # only. Grouping them keeps one pull request per batch instead of one per
      # advisory.
      security:
        applies-to: security-updates
        patterns:
          - '*'
      development:
        dependency-type: development
      production:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    open-pull-requests-limit: 3
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        patterns:
          - '*'
