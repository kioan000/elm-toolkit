name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks first, so a release is cut only from
  # code that passes them.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  check:
    name: Lint, format, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      # Placed after corepack enable on purpose. The cache input of setup-node
      # restores before corepack has created the yarn shim, so it cannot detect
      # the package manager. Yarn verifies every entry against the checksums in
      # the lockfile, which makes a partial restore safe.
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      # The tests run the real Elm compiler, which downloads the packages that the
      # test projects pin into ~/.elm. Restoring that folder keeps most runs away
      # from package.elm-lang.org. An older cache is safe, because Elm downloads
      # only what is missing.
      - uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ runner.os }}-${{ hashFiles('workspaces/*/test/fixtures/**/elm.json') }}
          restore-keys: |
            elm-${{ runner.os }}-

      # The install also builds every workspace, through the root postinstall
      # script, and fails if the lockfile is not current.
      - run: yarn install --immutable

      - run: yarn eslint .

      - run: yarn prettier --check .

      - run: yarn test
