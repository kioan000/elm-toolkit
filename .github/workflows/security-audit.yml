name: Security audit

# Dependabot opens security pull requests when an advisory is published, which
# depends on alerts being enabled for the repository. This job is the scheduled
# counterpart: it asks the registry every week whether anything in the installed
# tree is known to be vulnerable, and reports it in one place.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  audit:
    name: Audit the dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: corepack enable

      # Placed after corepack enable on purpose. The cache input of setup-node
      # restores before corepack has created the yarn shim, so it cannot detect
      # the package manager. Yarn verifies every entry against the checksums in
      # the lockfile, which makes a partial restore safe.
      - uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - run: yarn install --immutable

      # Transitive dependencies are included, because most advisories reach a
      # project that way. The job fails on high and critical findings only, so
      # that a low severity advisory does not turn the schedule red every week.
      - name: Audit
        run: yarn npm audit --all --recursive --severity high
